name: SatisfactoryServerApp
options:
  bundleIdPrefix: com.hjorven
  deploymentTarget:
    iOS: "26.0"
  minimumXcodeGenVersion: "2.38.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  SatisfactoryServerApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hjorven.satisfactoryserverapp
        PRODUCT_NAME: Satisfactory
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Satisfactory
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: "Findet deinen Satisfactory-Server automatisch im WLAN."
        NSBonjourServices:
          - _satisctl._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets: []
